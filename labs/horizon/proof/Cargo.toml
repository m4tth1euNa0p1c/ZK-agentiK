[package]
name = "horizon-proof"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[dependencies]
anyhow = "=1.0.100"
bulletproofs = "=5.0.0"
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
hex = "=0.4.3"
merlin = "=3.0.0"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[[bin]]
name = "horizon-proof-worker"
path = "src/main.rs"

[[bin]]
name = "horizon-benchmark"
path = "src/bin/benchmark.rs"
