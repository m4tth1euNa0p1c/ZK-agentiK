name: Publish experimental alpha
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed alpha tag on main (for example v0.1.0-alpha.1)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'm4tth1euNa0p1c/ZK-agentic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      tarball: ${{ steps.identity.outputs.tarball }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Accept only explicit alpha tags
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.(0|[1-9][0-9]*)$ ]]; then
            echo 'An existing vMAJOR.MINOR.PATCH-alpha.N tag is required.' >&2
            exit 2
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
          cache: npm
      - name: Bind tag, main ancestry and both package versions
        id: identity
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          const sdk = JSON.parse(readFileSync('packages/proofkit-sdk/package.json', 'utf8'));
          const version = process.env.RELEASE_TAG.slice(1);
          if (root.version !== version || sdk.version !== version ||
              sdk.name !== '@m4tth1euna0p1c/proofkit-sdk' || sdk.private === true ||
              sdk.publishConfig?.registry !== 'https://npm.pkg.github.com' || sdk.publishConfig?.tag !== 'alpha') {
            throw new Error('RELEASE_IDENTITY_MISMATCH');
          }
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const tagged = execFileSync('git', ['rev-parse', `refs/tags/${process.env.RELEASE_TAG}^{commit}`], { encoding: 'utf8' }).trim();
          if (commit !== tagged || !/^[a-f0-9]{40}$/.test(commit)) throw new Error('TAG_COMMIT_MISMATCH');
          appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\nversion=${version}\ntarball=m4tth1euna0p1c-proofkit-sdk-${version}.tgz\n`);
          NODE
      - name: Require successful quality, publication and circuit workflows on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const checks = [];
          for (const workflow of ['ci.yml', 'evidence.yml', 'circuit-validation.yml']) {
            const endpoint = `repos/${process.env.GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${process.env.RELEASE_COMMIT}&per_page=100`;
            const { workflow_runs: runs } = JSON.parse(execFileSync('gh', ['api', endpoint], { encoding: 'utf8' }));
            const candidates = runs.filter(run => run.head_sha === process.env.RELEASE_COMMIT &&
              run.head_branch === 'main' && ['push', 'workflow_dispatch'].includes(run.event))
              .sort((a, b) => b.run_number - a.run_number || b.run_attempt - a.run_attempt);
            const latest = candidates[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error(`REQUIRED_WORKFLOW_NOT_SUCCESSFUL: ${workflow} at ${process.env.RELEASE_COMMIT}`);
            }
            console.log(`${workflow}: ${latest.html_url} (${latest.head_sha})`);
            checks.push({ workflow, run_id: latest.id, url: latest.html_url, commit: latest.head_sha });
          }
          writeFileSync('release-workflow-checks.json', JSON.stringify(checks) + '\n', { flag: 'wx' });
          NODE
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:proofkit
      - run: npm run release:check -- --out-dir release-dist
      - name: Select the package and historical PDF explicitly
        env:
          RELEASE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_TARBALL: ${{ steps.identity.outputs.tarball }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { lstatSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          mkdirSync('public-release');
          const files = [];
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          for (const [source, name, role] of [
            [`release-dist/${process.env.RELEASE_TARBALL}`, process.env.RELEASE_TARBALL, 'npm-package'],
            ['docs/whitepaper/whitepaper.pdf', 'whitepaper.pdf', 'historical-checkout-pdf'],
          ]) {
            const stat = lstatSync(source);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size > 64 * 1024 * 1024) {
              throw new Error('UNSAFE_RELEASE_FILE');
            }
            const bytes = readFileSync(source);
            if (bytes.length === 0) throw new Error('EMPTY_RELEASE_FILE');
            writeFileSync(`public-release/${name}`, bytes, { flag: 'wx' });
            files.push({ name, role, bytes: bytes.length, sha256: sha256(bytes) });
          }
          const manifest = {
            schema: 'zk-agentik-release-v1', tag: process.env.RELEASE_TAG,
            version: process.env.RELEASE_VERSION, commit: process.env.RELEASE_COMMIT,
            package: { name: '@m4tth1euna0p1c/proofkit-sdk', filename: process.env.RELEASE_TARBALL,
              registry: 'https://npm.pkg.github.com', dist_tag: 'alpha' },
            checks: JSON.parse(readFileSync('release-workflow-checks.json', 'utf8')),
            files, scope: 'Experimental laboratory. PDF copied from this commit, not rebuilt by this workflow. SHA-256 identifies bytes; no external audit or trusted timestamp.',
          };
          const bytes = Buffer.from(JSON.stringify(manifest, null, 2) + '\n');
          writeFileSync('public-release/RELEASE.json', bytes, { flag: 'wx' });
          const sums = files.map(file => `${file.sha256}  ${file.name}`);
          sums.push(`${sha256(bytes)}  RELEASE.json`);
          writeFileSync('public-release/SHA256SUMS', sums.sort().join('\n') + '\n', { flag: 'wx' });
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public-release/${{ steps.identity.outputs.tarball }}
            public-release/whitepaper.pdf
            public-release/RELEASE.json
            public-release/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARBALL: ${{ needs.prepare.outputs.tarball }}
    steps:
      # No checkout and no lifecycle scripts in the job holding publication credentials.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
          registry-url: https://npm.pkg.github.com
          scope: '@m4tth1euna0p1c'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-release
      - name: Verify immutable artifacts, reconcile existing versions, then publish once
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          npm_config_ignore_scripts: 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync, spawnSync } from 'node:child_process';
          const { RELEASE_TAG: tag, RELEASE_COMMIT: commit, RELEASE_VERSION: version,
            RELEASE_TARBALL: tarball, GITHUB_REPOSITORY: repo } = process.env;
          const packageName = '@m4tth1euna0p1c/proofkit-sdk';
          const expected = [tarball, 'whitepaper.pdf', 'RELEASE.json', 'SHA256SUMS'].sort();
          if (JSON.stringify(readdirSync('public-release').sort()) !== JSON.stringify(expected)) {
            throw new Error('UNEXPECTED_RELEASE_FILES');
          }
          const bytes = new Map(expected.map(name => {
            const path = `public-release/${name}`, stat = lstatSync(path);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.nlink !== 1 || stat.size === 0 || stat.size > 64 * 1024 * 1024) {
              throw new Error('UNSAFE_DOWNLOADED_ARTIFACT');
            }
            return [name, readFileSync(path)];
          }));
          const sha256 = value => createHash('sha256').update(value).digest('hex');
          const sums = expected.filter(name => name !== 'SHA256SUMS')
            .map(name => `${sha256(bytes.get(name))}  ${name}`).sort().join('\n') + '\n';
          if (bytes.get('SHA256SUMS').toString() !== sums) throw new Error('RELEASE_CHECKSUM_MISMATCH');
          const manifest = JSON.parse(bytes.get('RELEASE.json'));
          if (manifest.schema !== 'zk-agentik-release-v1' || manifest.tag !== tag || manifest.version !== version ||
              manifest.commit !== commit || manifest.package.name !== packageName || manifest.package.filename !== tarball ||
              manifest.package.registry !== 'https://npm.pkg.github.com' || manifest.package.dist_tag !== 'alpha' ||
              manifest.files.length !== 2) throw new Error('RELEASE_MANIFEST_MISMATCH');
          const workflows = ['ci.yml', 'evidence.yml', 'circuit-validation.yml'];
          if (!Array.isArray(manifest.checks) || manifest.checks.length !== workflows.length) throw new Error('RELEASE_CHECKS_MISSING');
          for (const workflow of workflows) {
            const check = manifest.checks.find(item => item.workflow === workflow);
            if (!check || check.commit !== commit || !Number.isSafeInteger(check.run_id) || check.run_id <= 0 ||
                check.url !== `https://github.com/${repo}/actions/runs/${check.run_id}`) throw new Error('RELEASE_CHECK_IDENTITY_MISMATCH');
          }
          for (const [name, role] of [[tarball, 'npm-package'], ['whitepaper.pdf', 'historical-checkout-pdf']]) {
            const file = manifest.files.find(item => item.name === name);
            if (!file || file.role !== role || file.bytes !== bytes.get(name).length || file.sha256 !== sha256(bytes.get(name))) {
              throw new Error('RELEASE_FILE_MANIFEST_MISMATCH');
            }
          }
          const packed = JSON.parse(execFileSync('tar', ['-xOf', `public-release/${tarball}`, 'package/package.json'], { encoding: 'utf8' }));
          if (packed.name !== packageName || packed.version !== version || packed.private === true) throw new Error('TARBALL_IDENTITY_MISMATCH');
          const api = async (path, { method = 'GET', body, allow404 = false, headers = {} } = {}) => {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method, headers: { Accept: 'application/vnd.github+json', Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28', ...headers }, ...(body === undefined ? {} : { body }),
            });
            if (response.status === 404 && allow404) return undefined;
            if (!response.ok) throw new Error(`GITHUB_API_${response.status}: ${method} ${path}`);
            return response.json();
          };
          // A moved tag or a rewrite of main invalidates preparation before any side effect.
          const tagged = await api(`commits/${encodeURIComponent(tag)}`);
          const ancestry = await api(`compare/${commit}...main`);
          if (tagged.sha !== commit || !['ahead', 'identical'].includes(ancestry.status)) throw new Error('RELEASE_REF_CHANGED');
          const notesFile = await api(`contents/docs/releases/${tag}.md?ref=${commit}`);
          if (notesFile.encoding !== 'base64' || notesFile.type !== 'file') throw new Error('RELEASE_NOTES_MISSING');
          const notes = Buffer.from(notesFile.content, 'base64').toString('utf8');
          if (!notes.trim()) throw new Error('EMPTY_RELEASE_NOTES');
          let release = await api(`releases/tags/${encodeURIComponent(tag)}`, { allow404: true });
          if (release) {
            if (release.draft || !release.prerelease || release.tag_name !== tag || release.body.trim() !== notes.trim()) {
              throw new Error('EXISTING_RELEASE_METADATA_MISMATCH');
            }
            const assets = await api(`releases/${release.id}/assets?per_page=100`);
            if (assets.length > expected.length || new Set(assets.map(asset => asset.name)).size !== assets.length) {
              throw new Error('UNEXPECTED_EXISTING_RELEASE_ASSETS');
            }
            for (const asset of assets) {
              if (!bytes.has(asset.name) || asset.size !== bytes.get(asset.name).length) throw new Error('EXISTING_ASSET_MISMATCH');
              const downloaded = execFileSync('gh', ['api', '-H', 'Accept: application/octet-stream',
                `repos/${repo}/releases/assets/${asset.id}`], { maxBuffer: 64 * 1024 * 1024 });
              if (sha256(downloaded) !== sha256(bytes.get(asset.name))) throw new Error('EXISTING_ASSET_BYTES_DIFFER');
            }
            release.assets = assets;
          }
          const integrity = `sha512-${createHash('sha512').update(bytes.get(tarball)).digest('base64')}`;
          const inspectPackage = () => {
            const result = spawnSync('npm', ['view', `${packageName}@${version}`, 'dist.integrity', '--json',
              '--registry=https://npm.pkg.github.com'], { encoding: 'utf8' });
            if (result.error || result.signal) throw new Error('REGISTRY_LOOKUP_FAILED');
            let response;
            try { response = JSON.parse(result.stdout); } catch { throw new Error('REGISTRY_LOOKUP_NOT_JSON'); }
            if (result.status === 0 && typeof response === 'string') return response;
            if (result.status !== 0 && response?.error?.code === 'E404') return undefined;
            throw new Error(`REGISTRY_LOOKUP_FAILED: ${response?.error?.code ?? result.status}`);
          };
          const existingIntegrity = inspectPackage();
          if (existingIntegrity !== undefined && existingIntegrity !== integrity) throw new Error('EXISTING_PACKAGE_BYTES_DIFFER');
          if (existingIntegrity === undefined) {
            // One attempt only. A failure may be ambiguous; a new run must first reconcile registry bytes.
            execFileSync('npm', ['publish', `public-release/${tarball}`, '--ignore-scripts', '--tag', 'alpha',
              '--registry=https://npm.pkg.github.com'], { stdio: 'inherit' });
            if (inspectPackage() !== integrity) throw new Error('PUBLISHED_PACKAGE_NOT_CONFIRMED');
          } else {
            console.log('The registry already contains this exact package; publication skipped.');
          }
          if (!release) {
            release = await api('releases', { method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ tag_name: tag, target_commitish: commit, name: `ZK-agentiK ${tag} — experimental alpha`,
                body: notes, draft: false, prerelease: true, make_latest: 'false' }) });
          }
          for (const name of expected) {
            if (release.assets.some(asset => asset.name === name)) continue;
            const response = await fetch(`https://uploads.github.com/repos/${repo}/releases/${release.id}/assets?name=${encodeURIComponent(name)}`, {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/octet-stream',
                'X-GitHub-Api-Version': '2022-11-28' }, body: bytes.get(name),
            });
            if (!response.ok) throw new Error(`ASSET_UPLOAD_${response.status}: ${name}`);
            const asset = await response.json();
            if (asset.size !== bytes.get(name).length) throw new Error('UPLOADED_ASSET_SIZE_MISMATCH');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Published or reconciled **${packageName}@${version}** and [${tag}](${release.html_url}) at \`${commit}\`.\n\n` +
            'The PDF is the historical file from that commit. Package visibility must be checked separately in GitHub Packages; a successful upload does not make it public.\n');
          NODE
